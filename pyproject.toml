[project]
name = "battery-dispatch"
version = "0.1.0"
description = "A simple battery dispatch simulation"
readme = "README.md"
authors = [
    { name = "Greg Harris", email = "me@gjharris.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

